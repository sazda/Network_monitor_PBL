<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Monitor – prijava</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Network Monitor</h1></header>
<main class="narrow">
  <section>
    <h2>Prijava</h2>
    <form id="login" class="stack">
      <label>Korisničko ime <input id="user" autocomplete="username" required autofocus></label>
      <label>Lozinka <input id="pass" type="password" autocomplete="current-password" required></label>
      <button type="submit">Prijavi se</button>
      <p id="msg"></p>
    </form>
  </section>
</main>
<script src="login.js"></script>
</body>
</html>
